<!DOCTYPE html>
<html lang="sr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .container {

    align-items: center;

    gap: 4px;

  .role {
    font-size: 32px;

  }

  .divider {
    width: 40px;
    height: 1px;
    background: #cccccc;
    margin: 8px 0;

  .contact {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 15px;
    font-weight: 400;
  }

  a {
    color: #0055cc;
    text-decoration: underline;
  }

    <h1><span>Stefan B. Aleksić</span><span class="role">Senior Product Designer</span></h1>
